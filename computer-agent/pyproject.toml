[project]
name = "computer-agent"
version = "0.1.0"
description = "Claude computer-use agent that sees the screen and controls mouse/keyboard, with safety guardrails"
requires-python = ">=3.10"
dependencies = ["pyautogui>=0.9.54", "pillow>=10"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.60"]
unicode = ["pyperclip>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
computer-agent = "computer_agent.cli:main"

[tool.setuptools]
packages = ["computer_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
